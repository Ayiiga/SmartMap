name: Deploy GigaLearn to Cloudflare

# Optional alternate host. Vercel is the primary production path (see gigalearn/docs/DEPLOY_VERCEL.md).
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: gigalearn

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gigalearn/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  skip:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare deploy not configured
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set."
          echo "Add the token as a repository secret, then re-run this workflow."
