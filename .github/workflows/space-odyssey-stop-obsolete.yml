name: SPACE ODYSSEY · Stop Superseded Android Builds
on:
  push:
    branches: [feature/space-odyssey-radio-comets-audio]
    paths: [.github/workflows/space-odyssey-stop-obsolete.yml]
permissions:
  actions: write
  contents: read
jobs:
  clean-up:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only obsolete SPACE ODYSSEY Android workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for run in 44831777229 44831887977 44831892613 44831959605 44832034814 44832053190 44832226148 44832278991 44832305322 44832310102; do
            data="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '{branch:.head_branch,workflow:.name,status:.status}' || true)"
            [[ "$data" == *'feature/space-odyssey-radio-comets-audio'* ]] || continue
            [[ "$data" == *'SPACE ODYSSEY'* ]] || continue
            [[ "$data" == *'in_progress'* || "$data" == *'queued'* ]] || continue
            echo "Canceling obsolete debug build: $run"
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run/cancel" || true
          done
