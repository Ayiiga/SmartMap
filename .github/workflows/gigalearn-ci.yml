name: GigaLearn Vercel CI

on:
  push:
    branches: [master, main, cursor/**]
    paths:
      - "gigalearn/**"
      - ".github/workflows/gigalearn-ci.yml"
      - ".github/workflows/gigalearn-ci.yml"
  pull_request:
    paths:
      - "gigalearn/**"

defaults:
  run:
    working-directory: gigalearn

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gigalearn/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # The production deployment is Vercel. The optional Cloudflare
      # adapter has an independent version compatibility issue and is
      # exercised only in the dedicated manual Cloudflare workflow.
      # Do not use '--dangerouslyUseUnsupportedNextVersion' to hide it.
      - name: Check GigaOrbit real asset files and generated route
        run: |
          python3 scripts/check-gigaorbit-assets.py
          test -f .next/server/app/gigaorbit.html
