name: SPACE ODYSSEY · Publish Verified APK Preview
on:
  push:
    branches: [feature/space-odyssey-phase2-android]
    paths:
      - .github/workflows/space-odyssey-release.yml
permissions:
  contents: write
  actions: read
jobs:
  publish-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download APK from the successful Godot build
        uses: actions/download-artifact@v4
        with:
          name: SPACE-ODYSSEY-Android-Debug
          run-id: 44829970676
          github-token: ${{ github.token }}
          path: apk
      - name: Independently verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s apk/SPACE_ODYSSEY_Debug.apk
          test -s apk/SPACE_ODYSSEY_Debug.apk.sha256
          expected="$(cut -d ' ' -f1 apk/SPACE_ODYSSEY_Debug.apk.sha256)"
          printf '%s  %s\n' "$expected" "apk/SPACE_ODYSSEY_Debug.apk" | sha256sum -c -
          unzip -tq apk/SPACE_ODYSSEY_Debug.apk
      - name: Publish APK as a downloadable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create 'space-odyssey-phase2-easy-launch-20261120' \
            apk/SPACE_ODYSSEY_Debug.apk \
            apk/SPACE_ODYSSEY_Debug.apk.sha256 \
            --title 'SPACE ODYSSEY — Easy Launch and 3D Upgrade' \
            --notes 'Updated offline Godot Android debug APK for testing. Direct PLAY ROCKET NOW on home menu (training is optional); large changing LAUNCH → SEPARATE STAGE → ENTER ORBIT control; guided beginner flight and clearer altitude, speed and fuel; more detailed procedural 3D astronaut and spacecraft models; 12 astronaut choices. Godot compilation, physics smoke tests, and APK export passed in GitHub Actions run 44829970676. This debug APK is signed with a different temporary certificate from the earlier preview: if Android reports App not installed, uninstall the previous preview first (that removes its local save). Moon transfer and landing are not included. Physical-device QA remains.' \
            --prerelease \
            --target '01e9a29d2931f8f737e7368bc0a0c7a7915d4a54'
